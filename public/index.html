<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ec">
    <title>Juze Theke</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#customer" aria-label="Juze Theke">
        <span class="brand-mark">JT</span>
        <span>Juze Theke</span>
      </a>
      <nav class="nav" aria-label="Bereiche">
        <a href="#customer">Eingabe</a>
        <a href="#staff">Team</a>
      </nav>
    </header>

    <main>
      <section id="customer" class="page-section customer-band">
        <div class="section-grid">
          <div>
            <p class="eyebrow">Kundeneingabe</p>
            <h1>Raum und Besuch eintragen</h1>
            <p class="lead">Jugendliche koennen ihren Aufenthalt eintragen. Die Liste dahinter ist nur nach Team-Login sichtbar.</p>
          </div>

          <form id="customerForm" class="panel form-panel">
            <label>
              Datum
              <input name="visitDate" type="date" required>
            </label>
            <label>
              Uhrzeit
              <input name="visitTime" type="time" required>
            </label>
            <label>
              Raumtyp
              <select name="roomType" required>
                <option value="">Bitte waehlen</option>
                <option value="Offener Bereich">Offener Bereich</option>
                <option value="Musikraum">Musikraum</option>
                <option value="Kreativraum">Kreativraum</option>
                <option value="Gamingraum">Gamingraum</option>
                <option value="Sport / Bewegung">Sport / Bewegung</option>
                <option value="Sonstiger Raum">Sonstiger Raum</option>
              </select>
            </label>
            <label>
              Hauptbesucher
              <input name="mainVisitor" autocomplete="name" required>
            </label>
            <label>
              Gaeste
              <textarea name="guests" rows="5" placeholder="Namen der weiteren Besucher, jeweils mit Komma oder neuer Zeile"></textarea>
            </label>
            <button class="primary-button" type="submit">Eintrag speichern</button>
            <p id="customerStatus" class="status" role="status"></p>
          </form>
        </div>
      </section>

      <section id="staff" class="page-section staff-band">
        <div class="staff-shell">
          <div class="section-heading">
            <p class="eyebrow">Team</p>
            <h2>Geschuetzter Bereich</h2>
          </div>

          <form id="loginForm" class="login-row">
            <label>
              Passwort
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="primary-button" type="submit">Anmelden</button>
            <p id="loginStatus" class="status" role="status"></p>
          </form>

          <div id="staffApp" class="staff-app" hidden>
            <div class="toolbar">
              <div class="tabs" role="tablist" aria-label="Teamansicht">
                <button class="tab is-active" data-tab="submissions" type="button">Liste</button>
                <button class="tab" data-tab="cashier" type="button">Kasse</button>
              </div>
              <button id="logoutButton" class="ghost-button" type="button">Abmelden</button>
            </div>

            <section id="submissionsView" class="staff-view">
              <div class="view-header">
                <h3>Kundeneintraege</h3>
                <button id="refreshSubmissions" class="ghost-button" type="button">Aktualisieren</button>
              </div>
              <div id="submissionsList" class="entry-list"></div>
            </section>

            <section id="cashierView" class="staff-view" hidden>
              <div class="view-header">
                <h3>Verkaufsliste</h3>
                <div class="button-group">
                  <button id="exportCashier" class="ghost-button" type="button">CSV Export</button>
                  <button id="resetCashier" class="danger-button" type="button">Zaehler resetten</button>
                </div>
              </div>

              <div id="cashierList" class="cashier-list"></div>

              <form id="offerForm" class="offer-form">
                <input name="name" placeholder="Neues Angebot" required>
                <input name="price" inputmode="decimal" placeholder="Preis, z.B. 2.50" required>
                <button class="primary-button" type="submit">Hinzufuegen</button>
              </form>

              <div class="total-row">
                <span>Summe</span>
                <strong id="cashierTotal">0,00 Euro</strong>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
